name: Compilar APK Godot
on:
  push:
    branches: [ main ]
    paths: [ 'godot/**', '.github/workflows/godot.yml' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: "4.3"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Instalar Godot y plantillas de exportación
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot-bin
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Configurar SDK de Android y llave de firma
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
      - name: Importar y exportar
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd godot
          mkdir -p build
          ../godot-bin --headless --import || true
          ../godot-bin --headless --export-debug "Android" build/IraDelOlimpo-3D.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with: { name: IraDelOlimpo-3D-apk, path: godot/build/IraDelOlimpo-3D.apk }
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-v0.1.${{ github.run_number }}
          name: Ira del Olimpo 3D (Godot) v0.1.${{ github.run_number }}
          files: godot/build/IraDelOlimpo-3D.apk
          body: Versión nativa en Godot 4 (fase 1, Tebas). Descarga IraDelOlimpo-3D.apk en el celular e instálalo.
