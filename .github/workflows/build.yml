name: Compilar APK
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', '.github/workflows/build.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk IraDelOlimpo.apk
      - uses: actions/upload-artifact@v4
        with: { name: IraDelOlimpo-apk, path: IraDelOlimpo.apk }
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ira del Olimpo v1.0.${{ github.run_number }}
          files: IraDelOlimpo.apk
          body: Descarga IraDelOlimpo.apk en tu celular e instálalo.
