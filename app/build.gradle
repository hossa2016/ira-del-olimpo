plugins { id 'com.android.application' }
android {
    namespace 'com.hossa.iradelolimpo'
    compileSdk 34
    defaultConfig {
        applicationId "com.hossa.iradelolimpo"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.2"
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'js', 'jpg', 'woff2', 'html' }
}
dependencies { }
